# lytebuy-blog-service
service: lytebuy-blog-service

custom:
  stage: ${opt:stage, 'development'}
  args: ${file(./config/${self:custom.stage}.yml)}
  pythonRequirements:
    # dockerizePip cross-compiles native deps in a Linux container
    dockerizePip: ${self:custom.args.dockerize_pip, true}
  customDomain: ${file(./config/${self:custom.stage}.yml):custom_domain}


provider:
  name: aws
  runtime: python3.12
  region: ${self:custom.args.region}
  stage: ${self:custom.args.stage}

  timeout: 29
  memorySize: 256
  logRetentionInDays: 7
  environment: ${self:custom.args.env_vars}
  deploymentBucket:
    name: ${self:custom.args.deploy_bucket}
  apiGateway:
    apiKeys:
      - ${self:custom.args.env}-lytebuy-blog-service-api-key
  # The Lambda is the only reader/writer of the blog bucket. GetObject/PutObject
  # (PutObject also covers copy_object onto self for the view-count bump) and
  # DeleteObject on the objects; ListBucket on the bucket for list + head_bucket.
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: "arn:aws:s3:::${self:custom.args.bucket_name}/*"
        - Effect: Allow
          Action:
            - s3:ListBucket
          Resource: "arn:aws:s3:::${self:custom.args.bucket_name}"

plugins:
  - serverless-offline
  - serverless-python-requirements
  - serverless-domain-manager

package:
  patterns:
    - "src/**"
    - "!config/**"
    - "!node_modules/**"
    - "!tests/**"
    - "!.venv/**"
    - "!.serverless/**"
    - "!.git/**"
    - "!**/__pycache__/**"

functions:
  api:
    handler: src/router.main
    events:
      # Public liveness check - no API key.
      - http:
          path: /health
          method: GET
          private: false
          cors: true

      # Public reads. The marketing site's blog and press index call these
      # anonymously, so they must not require a key.
      - http:
          path: /posts
          method: GET
          private: false
          cors: true
      - http:
          path: /press-releases
          method: GET
          private: false
          cors: true

      # Public single-item reads. They no longer bump the view counter, so like
      # the list routes they need no key. Writes below stay guarded.
      - http:
          path: /posts/{post_id}
          method: GET
          private: false
          cors: true
      - http:
          path: /posts
          method: POST
          private: true
          cors: true
      - http:
          path: /posts/{post_id}
          method: PUT
          private: true
          cors: true
      # Public view-bump: the host app calls this after the post page loads.
      - http:
          path: /posts/{post_id}/views
          method: POST
          private: false
          cors: true

      - http:
          path: /press-releases/{post_id}
          method: GET
          private: false
          cors: true
      - http:
          path: /press-releases
          method: POST
          private: true
          cors: true
      - http:
          path: /press-releases/{post_id}
          method: PUT
          private: true
          cors: true
      - http:
          path: /press-releases/{post_id}/views
          method: POST
          private: false
          cors: true

      # Featured vendor spotlight. Public read of the currently-active feature;
      # writes require the API key.
      - http:
          path: /featured
          method: GET
          private: false
          cors: true
      - http:
          path: /featured/{feature_id}
          method: GET
          private: true
          cors: true
      - http:
          path: /featured
          method: POST
          private: true
          cors: true
      - http:
          path: /featured/{feature_id}
          method: PUT
          private: true
          cors: true


# The blog storage bucket, owned by this stack per stage. Not versioned: the
# view-count bump copies each object onto itself, which would otherwise pile up
# a new version on every page view. Public access is blocked - the Lambda role is
# the only reader/writer. A CloudFormation-managed bucket must be empty to delete
# and will fail to create if the (globally unique) name already exists.
resources:
  Resources:
    BlogBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.args.bucket_name}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
